<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Vision Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cork-a:#c78e57;
    --cork-b:#b47a45;
    --frame:#5c3a24;
    --frame-dark:#3f2717;
    --paper:#fffcf5;
    --ink:#2b2320;
    --ink-soft:#5a4d43;
    --yellow:#ffe08a;
    --pink:#ffc2d1;
    --mint:#bfe3c4;
    --blue:#b7d8f5;
    --lavender:#dcc9f2;
    --pin-light:#eee;
    --pin-dark:#8a8a8a;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--frame-dark);
    font-family:'Work Sans', sans-serif;
    color:var(--ink);
    overflow-x:hidden;
  }

  .frame{
    position:relative;
    margin:14px;
    border-radius:6px;
    padding:16px;
    background:
      linear-gradient(135deg, #7a5236, #4c2f1c 60%, #3a2314);
    box-shadow:
      0 20px 50px rgba(0,0,0,0.5),
      inset 0 0 0 2px rgba(0,0,0,0.35),
      inset 0 0 30px rgba(0,0,0,0.4);
  }

  .board-wrap{
    position:relative;
    border-radius:2px;
    overflow:hidden;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.45);
  }

  .board{
    position:relative;
    min-height:1500px;
    background-color:var(--cork-a);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(90,55,25,0.35) 0, transparent 3px),
      radial-gradient(circle at 40% 65%, rgba(90,55,25,0.3) 0, transparent 2.5px),
      radial-gradient(circle at 70% 30%, rgba(90,55,25,0.32) 0, transparent 3px),
      radial-gradient(circle at 85% 75%, rgba(90,55,25,0.28) 0, transparent 2px),
      radial-gradient(circle at 55% 10%, rgba(90,55,25,0.3) 0, transparent 2.5px),
      radial-gradient(circle at 25% 85%, rgba(90,55,25,0.3) 0, transparent 3px),
      radial-gradient(circle at 90% 15%, rgba(90,55,25,0.25) 0, transparent 2px),
      linear-gradient(135deg, var(--cork-a), var(--cork-b));
    background-size:
      60px 60px, 70px 70px, 55px 55px, 65px 65px, 80px 80px, 50px 50px, 75px 75px, 100% 100%;
    touch-action:none;
  }

  /* header inside board */
  .board-header{
    position:relative;
    z-index:5;
    padding:34px 40px 10px;
    text-align:center;
    pointer-events:none;
  }
  .board-header h1{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:56px;
    margin:0 0 2px;
    color:#fff8ea;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.25);
    transform: rotate(-1.2deg);
    letter-spacing:0.5px;
  }
  .board-header .sub{
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:#fbe9cf;
    opacity:0.85;
    pointer-events:auto;
  }
  .board-header .sub input{
    background:transparent;
    border:none;
    border-bottom:1px dashed rgba(255,255,255,0.5);
    color:#fff8ea;
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    width:56px;
    text-align:center;
  }
  .board-header .sub input:focus{outline:none; border-bottom-color:#fff;}

  /* toolbar */
  .toolbar{
    position:sticky;
    top:0;
    z-index:50;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    padding:12px 16px;
    background:linear-gradient(180deg, #4c2f1c, #43291a);
    border-bottom:2px solid var(--frame-dark);
  }
  .toolbar .group{
    display:flex;
    gap:6px;
    align-items:center;
  }
  .tb-btn{
    font-family:'Work Sans', sans-serif;
    font-size:13px;
    font-weight:600;
    color:#3a2a1a;
    background:var(--paper);
    border:none;
    border-radius:4px;
    padding:8px 12px;
    cursor:pointer;
    box-shadow: 0 2px 0 rgba(0,0,0,0.25);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    white-space:nowrap;
  }
  .tb-btn:hover{ transform: translateY(-1px); box-shadow: 0 3px 0 rgba(0,0,0,0.3); }
  .tb-btn:active{ transform: translateY(1px); box-shadow: 0 1px 0 rgba(0,0,0,0.3); }
  .tb-btn.goal{background:var(--yellow);}
  .tb-btn.photo{background:var(--blue);}
  .tb-btn.quote{background:var(--lavender);}
  .tb-btn.checklist{background:var(--mint);}

  .tb-spacer{flex:1;}
  .save-status{
    font-size:12px;
    color:#e6d3bd;
    font-style:italic;
    min-width:70px;
    text-align:right;
  }
  .clear-btn{
    background:transparent;
    color:#e6c9c9;
    border:1px solid rgba(230,201,201,0.4);
    border-radius:4px;
    font-size:12px;
    padding:7px 10px;
    cursor:pointer;
    font-family:'Work Sans', sans-serif;
  }
  .clear-btn:hover{ background:rgba(255,255,255,0.06); }

  /* card base */
  .card{
    position:absolute;
    width:220px;
    padding:16px 14px 14px;
    background:var(--paper);
    box-shadow:
      0 10px 18px rgba(0,0,0,0.35),
      0 2px 4px rgba(0,0,0,0.2);
    cursor:grab;
    user-select:none;
    z-index:2;
  }
  .card.dragging{ cursor:grabbing; box-shadow: 0 22px 30px rgba(0,0,0,0.45); z-index:999 !important; }
  .card.photo-card{ width:240px; }

  .washi{
    position:absolute;
    top:-11px;
    left:50%;
    transform: translateX(-50%) rotate(-3deg);
    min-width:78px;
    max-width:150px;
    padding:5px 10px;
    text-align:center;
    font-size:10.5px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    font-weight:600;
    color:#4a3a20;
    opacity:0.92;
    box-shadow:0 1px 2px rgba(0,0,0,0.15);
  }
  .washi[contenteditable="true"]{cursor:text;}
  .washi.c-yellow{background: repeating-linear-gradient(45deg, #ffd75e, #ffd75e 6px, #ffcf3f 6px, #ffcf3f 12px); }
  .washi.c-pink{background: repeating-linear-gradient(45deg, #ff9fb8, #ff9fb8 6px, #ff8aa8 6px, #ff8aa8 12px); }
  .washi.c-mint{background: repeating-linear-gradient(45deg, #8fd2a0, #8fd2a0 6px, #7bc790 6px, #7bc790 12px); }
  .washi.c-blue{background: repeating-linear-gradient(45deg, #8fc1ee, #8fc1ee 6px, #7bb3e6 6px, #7bb3e6 12px); }
  .washi.c-lavender{background: repeating-linear-gradient(45deg, #c8a8ec, #c8a8ec 6px, #bd97e8 6px, #bd97e8 12px); }

  .pin{
    position:absolute;
    top:-16px;
    left:50%;
    transform:translateX(-50%);
    width:16px;
    height:16px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--pin-light) 40%, var(--pin-dark) 100%);
    box-shadow: 0 3px 4px rgba(0,0,0,0.45);
    z-index:3;
  }

  .card-body{
    margin-top:10px;
    font-size:15px;
    line-height:1.4;
    color:var(--ink);
    min-height:40px;
    outline:none;
  }
  .card-body[contenteditable="true"]:empty:before{
    content: attr(data-placeholder);
    color:#a89a89;
  }

  .quote-card .card-body{
    font-family:'Caveat', cursive;
    font-size:24px;
    font-weight:600;
    text-align:center;
    color:#3a2a4a;
    line-height:1.25;
  }

  .swatches{
    display:flex;
    gap:6px;
    margin-top:12px;
    justify-content:center;
  }
  .swatch{
    width:14px;height:14px;border-radius:50%;
    border:1px solid rgba(0,0,0,0.15);
    cursor:pointer;
  }
  .swatch.sw-yellow{background:var(--yellow);}
  .swatch.sw-pink{background:var(--pink);}
  .swatch.sw-mint{background:var(--mint);}
  .swatch.sw-blue{background:var(--blue);}
  .swatch.sw-lavender{background:var(--lavender);}

  .del-btn{
    position:absolute;
    top:4px;
    right:6px;
    border:none;
    background:transparent;
    color:#b7a58f;
    font-size:15px;
    cursor:pointer;
    line-height:1;
    padding:2px 5px;
    opacity:0;
    transition:opacity 0.15s ease;
  }
  .card:hover .del-btn{opacity:1;}
  .del-btn:hover{color:#a13d3d;}

  /* photo card specifics */
  .photo-frame{
    width:100%;
    aspect-ratio: 4/3;
    background:#eee4d3;
    border:1px solid #d8c9ae;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    margin-top:6px;
  }
  .photo-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
  }
  .photo-frame .ph-empty{
    font-size:11px;
    color:#a08f76;
    text-align:center;
    padding:10px;
    font-family:'Work Sans', sans-serif;
  }
  .url-input{
    width:100%;
    margin-top:8px;
    font-size:11px;
    font-family:'Work Sans', sans-serif;
    padding:5px 6px;
    border:1px solid #ddd0ba;
    border-radius:3px;
    color:#5a4d3f;
    background:#fffef9;
  }
  .caption{
    margin-top:8px;
    font-size:13px;
    text-align:center;
    font-style:italic;
    color:var(--ink-soft);
    outline:none;
  }
  .caption[contenteditable="true"]:empty:before{
    content:attr(data-placeholder);
    color:#b7a891;
  }

  /* checklist */
  .checklist{
    margin-top:8px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .cl-item{
    display:flex;
    align-items:flex-start;
    gap:7px;
    font-size:13.5px;
  }
  .cl-item input[type=checkbox]{
    margin-top:3px;
    accent-color:#6b9e73;
    cursor:pointer;
  }
  .cl-item .cl-text{
    flex:1;
    outline:none;
  }
  .cl-item.done .cl-text{
    text-decoration:line-through;
    color:#9a8f81;
  }
  .cl-item .cl-del{
    border:none;background:none;color:#c2b6a4;cursor:pointer;font-size:13px;padding:0 2px;
  }
  .cl-item .cl-del:hover{color:#a13d3d;}
  .add-item-btn{
    margin-top:4px;
    font-size:12px;
    background:none;
    border:none;
    color:#6b5a44;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
    text-align:left;
    font-family:'Work Sans', sans-serif;
  }

  @media (max-width:640px){
    .board-header h1{font-size:38px;}
    .toolbar{gap:6px;}
    .tb-btn{padding:7px 9px; font-size:12px;}
    .card{width:180px;}
    .card.photo-card{width:190px;}
  }

  ::selection{ background: #ffdf8f; }

  .lock-overlay{
    position:fixed;
    inset:0;
    background:var(--frame-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
  }
  .lock-card{
    position:relative;
    width:280px;
    background:var(--paper);
    padding:30px 24px 24px;
    box-shadow:0 20px 40px rgba(0,0,0,0.5);
    text-align:center;
  }
  .lock-card .pin{ top:-16px; }
  .lock-card .washi{
    position:absolute;
    top:-11px;
    left:50%;
    transform:translateX(-50%) rotate(-3deg);
    padding:5px 14px;
    font-size:10.5px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    font-weight:600;
    color:#4a3a20;
    background: repeating-linear-gradient(45deg, #ffd75e, #ffd75e 6px, #ffcf3f 6px, #ffcf3f 12px);
  }
  .lock-card h2{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:30px;
    margin:14px 0 4px;
    color:var(--ink);
  }
  .lock-card p{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0 0 16px;
  }
  .lock-card input{
    width:100%;
    padding:9px 10px;
    margin-bottom:10px;
    border:1px solid #ddd0ba;
    border-radius:3px;
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    text-align:center;
    background:#fffef9;
  }
  .lock-card button{
    width:100%;
    font-family:'Work Sans', sans-serif;
    font-size:13px;
    font-weight:600;
    color:#3a2a1a;
    background:var(--yellow);
    border:none;
    border-radius:4px;
    padding:9px 12px;
    cursor:pointer;
    box-shadow:0 2px 0 rgba(0,0,0,0.25);
  }
  .lock-card button:hover{ background:#ffd873; }
  .lock-error{
    color:#a13d3d;
    font-size:12px;
    min-height:16px;
    margin-top:10px;
  }
</style>
</head>
<body>

<div class="lock-overlay" id="lockSetup" style="display:none;">
  <div class="lock-card">
    <div class="pin"></div>
    <div class="washi">new board</div>
    <h2>Set a password</h2>
    <p>This locks your vision board on this device.</p>
    <input type="password" id="setupPass" placeholder="Choose a password">
    <button onclick="handleSetup()">Save &amp; continue</button>
    <p class="lock-error" id="setupError"></p>
  </div>
</div>

<div class="lock-overlay" id="lockLogin" style="display:none;">
  <div class="lock-card">
    <div class="pin"></div>
    <div class="washi">locked</div>
    <h2>Welcome back</h2>
    <p>Enter your password to see your board.</p>
    <input type="password" id="loginPass" placeholder="Password" onkeydown="if(event.key==='Enter')handleLogin()">
    <button onclick="handleLogin()">Unlock</button>
    <p class="lock-error" id="loginError"></p>
  </div>
</div>

<div id="app" style="display:none;">
<div class="frame">
  <div class="board-wrap">
    <div class="toolbar">
      <div class="group">
        <button class="tb-btn goal" data-add="goal">+ Goal</button>
        <button class="tb-btn photo" data-add="photo">+ Photo</button>
        <button class="tb-btn quote" data-add="quote">+ Quote</button>
        <button class="tb-btn checklist" data-add="checklist">+ Checklist</button>
      </div>
      <div class="tb-spacer"></div>
      <button class="clear-btn" id="exportBoard">Export</button>
      <button class="clear-btn" id="importBoard">Import</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
      <span class="save-status" id="saveStatus">loading…</span>
      <button class="clear-btn" id="clearBoard">Clear board</button>
    </div>

    <div class="board" id="board">
      <div class="board-header">
        <h1>My College Vision Board</h1>
        <div class="sub">Class of <input id="gradYear" type="text" maxlength="4" value="2030"></div>
      </div>
      <!-- cards injected here -->
    </div>
  </div>
</div>
</div>

<script>
(function(){
  const board = document.getElementById('board');
  const saveStatus = document.getElementById('saveStatus');
  const gradYearInput = document.getElementById('gradYear');
  const STORAGE_KEY = 'vision-board-state';

  const COLORS = ['yellow','pink','mint','blue','lavender'];
  let topZ = 10;
  let saveTimer = null;

  const uid = () => 'c' + Math.random().toString(36).slice(2,10);

  function starterCards(){
    return [
      {id:uid(), type:'goal', x:60, y:130, rot:-2.5, color:'yellow', label:'college', text:'Get into my dream school'},
      {id:uid(), type:'goal', x:340, y:90, rot:2, color:'blue', label:'career', text:'Land an internship in my field by sophomore year'},
      {id:uid(), type:'quote', x:640, y:150, rot:-1.5, color:'lavender', label:'mindset', text:'Small steps every day beat big leaps once in a while.'},
      {id:uid(), type:'checklist', x:80, y:400, rot:1.5, color:'mint', label:'freshman year', items:[
        {text:'Ace orientation week', done:false},
        {text:'Join one club', done:false},
        {text:'Find my favorite study spot', done:false},
        {text:'Meet my advisor', done:false}
      ]},
      {id:uid(), type:'photo', x:400, y:380, rot:2.5, color:'pink', label:'dream campus', imageUrl:'', caption:'Paste a photo link here'}
    ];
  }

  let state = { gradYear:'2030', cards: [] };

  let storageWorking = true;

  const PASS_KEY = 'vision-board-password-hash';

  async function sha256(text){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  function initAuth(){
    let storedHash = null;
    try{ storedHash = localStorage.getItem(PASS_KEY); }catch(e){ /* no localStorage — skip the lock entirely */ }

    if(typeof crypto === 'undefined' || !crypto.subtle){
      // no crypto available (very old browser) — skip the lock rather than block access
      unlockApp();
      return;
    }

    if(!storedHash){
      document.getElementById('lockSetup').style.display = 'flex';
    }else{
      window._storedHash = storedHash;
      document.getElementById('lockLogin').style.display = 'flex';
      document.getElementById('loginPass').focus();
    }
  }

  async function handleSetup(){
    const pass = document.getElementById('setupPass').value;
    if(!pass || pass.length < 4){
      document.getElementById('setupError').textContent = 'Use at least 4 characters.';
      return;
    }
    const hash = await sha256(pass);
    try{ localStorage.setItem(PASS_KEY, hash); }catch(e){
      document.getElementById('setupError').textContent = "Couldn't save a password on this device.";
      return;
    }
    document.getElementById('lockSetup').style.display = 'none';
    unlockApp();
  }

  async function handleLogin(){
    const pass = document.getElementById('loginPass').value;
    const hash = await sha256(pass);
    if(hash === window._storedHash){
      document.getElementById('lockLogin').style.display = 'none';
      unlockApp();
    }else{
      document.getElementById('loginError').textContent = 'Incorrect password.';
      document.getElementById('loginPass').value = '';
      document.getElementById('loginPass').focus();
    }
  }

  function unlockApp(){
    document.getElementById('app').style.display = 'block';
    load();
  }

  window.handleSetup = handleSetup;
  window.handleLogin = handleLogin;

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.cards)){
          state = parsed;
        } else {
          state = { gradYear:'2030', cards: starterCards() };
        }
      } else {
        state = { gradYear:'2030', cards: starterCards() };
      }
      setSaved(true);
    }catch(e){
      // localStorage unavailable (e.g. private browsing in some browsers) — fall back to session only
      storageWorking = false;
      state = { gradYear:'2030', cards: starterCards() };
      saveStatus.textContent = 'no storage — session only';
    }
    gradYearInput.value = state.gradYear || '2030';
    renderAll();
  }

  function scheduleSave(){
    if(!storageWorking){
      saveStatus.textContent = 'no storage — session only';
      return;
    }
    setSaved(false);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        setSaved(true);
      }catch(e){
        console.error('Vision board save error:', e);
        saveStatus.textContent = 'save failed: ' + (e && e.message ? e.message : 'unknown error');
      }
    }, 400);
  }

  function setSaved(saved){
    saveStatus.textContent = saved ? 'saved ✓' : 'saving…';
  }

  function renderAll(){
    document.querySelectorAll('.card').forEach(el=>el.remove());
    state.cards.forEach(c=> board.appendChild(buildCard(c)));
  }

  function buildCard(c){
    const el = document.createElement('div');
    el.className = 'card' + (c.type==='photo' ? ' photo-card' : '') + (c.type==='quote' ? ' quote-card' : '');
    el.style.left = c.x + 'px';
    el.style.top = c.y + 'px';
    el.style.transform = 'rotate(' + c.rot + 'deg)';
    el.style.background = 'var(--paper)';
    el.dataset.id = c.id;
    topZ += 1;
    el.style.zIndex = topZ;

    el.innerHTML = `
      <div class="pin"></div>
      <div class="washi c-${c.color}" contenteditable="true" data-field="label">${escapeHtml(c.label || '')}</div>
      <button class="del-btn" title="Remove">✕</button>
      ${cardInner(c)}
      <div class="swatches">
        ${COLORS.map(col=>`<span class="swatch sw-${col}" data-color="${col}"></span>`).join('')}
      </div>
    `;

    // delete
    el.querySelector('.del-btn').addEventListener('click', (e)=>{
      e.stopPropagation();
      state.cards = state.cards.filter(x=>x.id!==c.id);
      el.remove();
      scheduleSave();
    });

    // color swatches
    el.querySelectorAll('.swatch').forEach(sw=>{
      sw.addEventListener('click', (e)=>{
        e.stopPropagation();
        c.color = sw.dataset.color;
        const washi = el.querySelector('.washi');
        washi.className = 'washi c-' + c.color;
        scheduleSave();
      });
    });

    // label edit
    const washiEl = el.querySelector('.washi');
    washiEl.addEventListener('pointerdown', e=> e.stopPropagation());
    washiEl.addEventListener('blur', ()=>{
      c.label = washiEl.textContent.trim();
      scheduleSave();
    });

    wireInner(el, c);
    wireDrag(el, c);

    return el;
  }

  function cardInner(c){
    if(c.type==='goal'){
      return `<div class="card-body" contenteditable="true" data-placeholder="What do you want to achieve?">${escapeHtml(c.text||'')}</div>`;
    }
    if(c.type==='quote'){
      return `<div class="card-body" contenteditable="true" data-placeholder="Write something that motivates you">${escapeHtml(c.text||'')}</div>`;
    }
    if(c.type==='photo'){
      const hasImg = c.imageUrl && c.imageUrl.trim().length>0;
      return `
        <div class="photo-frame">
          ${hasImg
            ? `<img src="${escapeAttr(c.imageUrl)}" onerror="this.parentElement.innerHTML='<div class=&quot;ph-empty&quot;>Couldn\\'t load that image link</div>'">`
            : `<div class="ph-empty">Paste an image link below</div>`}
        </div>
        <input class="url-input" type="text" placeholder="https://... image link" value="${escapeAttr(c.imageUrl||'')}">
        <div class="caption" contenteditable="true" data-placeholder="Caption this photo">${escapeHtml(c.caption||'')}</div>
      `;
    }
    if(c.type==='checklist'){
      return `<div class="checklist">${(c.items||[]).map((it,i)=>checklistItemHtml(it,i)).join('')}</div>
              <button class="add-item-btn">+ add item</button>`;
    }
    return '';
  }

  function checklistItemHtml(it, i){
    return `
      <div class="cl-item ${it.done?'done':''}" data-idx="${i}">
        <input type="checkbox" ${it.done?'checked':''}>
        <span class="cl-text" contenteditable="true">${escapeHtml(it.text||'')}</span>
        <button class="cl-del">✕</button>
      </div>
    `;
  }

  function wireInner(el, c){
    if(c.type==='goal' || c.type==='quote'){
      const body = el.querySelector('.card-body');
      body.addEventListener('pointerdown', e=>e.stopPropagation());
      body.addEventListener('blur', ()=>{
        c.text = body.textContent.trim();
        scheduleSave();
      });
    }

    if(c.type==='photo'){
      const urlInput = el.querySelector('.url-input');
      const caption = el.querySelector('.caption');
      urlInput.addEventListener('pointerdown', e=>e.stopPropagation());
      urlInput.addEventListener('keydown', e=>e.stopPropagation());
      urlInput.addEventListener('change', ()=>{
        c.imageUrl = urlInput.value.trim();
        const frame = el.querySelector('.photo-frame');
        frame.innerHTML = c.imageUrl
          ? `<img src="${escapeAttr(c.imageUrl)}" onerror="this.parentElement.innerHTML='<div class=&quot;ph-empty&quot;>Couldn\\'t load that image link</div>'">`
          : `<div class="ph-empty">Paste an image link below</div>`;
        scheduleSave();
      });
      caption.addEventListener('pointerdown', e=>e.stopPropagation());
      caption.addEventListener('blur', ()=>{
        c.caption = caption.textContent.trim();
        scheduleSave();
      });
    }

    if(c.type==='checklist'){
      wireChecklist(el, c);
      const addBtn = el.querySelector('.add-item-btn');
      addBtn.addEventListener('pointerdown', e=>e.stopPropagation());
      addBtn.addEventListener('click', (e)=>{
        e.stopPropagation();
        c.items = c.items || [];
        c.items.push({text:'', done:false});
        const listEl = el.querySelector('.checklist');
        listEl.innerHTML = c.items.map((it,i)=>checklistItemHtml(it,i)).join('');
        wireChecklist(el, c);
        scheduleSave();
        const lastText = listEl.querySelector('.cl-item:last-child .cl-text');
        if(lastText) lastText.focus();
      });
    }
  }

  function wireChecklist(el, c){
    const listEl = el.querySelector('.checklist');
    listEl.querySelectorAll('.cl-item').forEach(itemEl=>{
      const idx = parseInt(itemEl.dataset.idx, 10);
      const cb = itemEl.querySelector('input[type=checkbox]');
      const txt = itemEl.querySelector('.cl-text');
      const delBtn = itemEl.querySelector('.cl-del');

      cb.addEventListener('pointerdown', e=>e.stopPropagation());
      cb.addEventListener('change', ()=>{
        c.items[idx].done = cb.checked;
        itemEl.classList.toggle('done', cb.checked);
        scheduleSave();
      });

      txt.addEventListener('pointerdown', e=>e.stopPropagation());
      txt.addEventListener('blur', ()=>{
        c.items[idx].text = txt.textContent.trim();
        scheduleSave();
      });

      delBtn.addEventListener('pointerdown', e=>e.stopPropagation());
      delBtn.addEventListener('click', (e)=>{
        e.stopPropagation();
        c.items.splice(idx,1);
        listEl.innerHTML = c.items.map((it,i)=>checklistItemHtml(it,i)).join('');
        wireChecklist(el, c);
        scheduleSave();
      });
    });
  }

  function wireDrag(el, c){
    let dragging = false;
    let offX=0, offY=0;

    el.addEventListener('pointerdown', (e)=>{
      // ignore if the target is editable / interactive
      if(e.target.closest('[contenteditable="true"]') || e.target.tagName==='INPUT' || e.target.closest('.del-btn') || e.target.closest('.swatch') || e.target.closest('.cl-del') || e.target.closest('.add-item-btn')) return;
      dragging = true;
      el.classList.add('dragging');
      el.setPointerCapture(e.pointerId);
      const rect = el.getBoundingClientRect();
      const boardRect = board.getBoundingClientRect();
      offX = e.clientX - rect.left;
      offY = e.clientY - rect.top;
      topZ += 1;
      el.style.zIndex = topZ;
    });

    el.addEventListener('pointermove', (e)=>{
      if(!dragging) return;
      const boardRect = board.getBoundingClientRect();
      let nx = e.clientX - boardRect.left - offX;
      let ny = e.clientY - boardRect.top - offY;
      nx = Math.max(-40, nx);
      ny = Math.max(0, ny);
      el.style.left = nx + 'px';
      el.style.top = ny + 'px';
    });

    function endDrag(e){
      if(!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      c.x = parseFloat(el.style.left);
      c.y = parseFloat(el.style.top);
      scheduleSave();
    }
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
  }

  function escapeHtml(str){
    return (str||'').replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }
  function escapeAttr(str){
    return escapeHtml(str);
  }

  // toolbar: add cards
  document.querySelectorAll('.tb-btn[data-add]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const type = btn.dataset.add;
      const baseX = 60 + (state.cards.length * 26) % 500;
      const baseY = 560 + (state.cards.length * 18) % 300;
      const rot = (Math.random()*6 - 3);
      const color = COLORS[Math.floor(Math.random()*COLORS.length)];
      let card = {id:uid(), type, x:baseX, y:baseY, rot, color, label:type};
      if(type==='goal') card.text = '';
      if(type==='quote') card.text = '';
      if(type==='photo'){ card.imageUrl=''; card.caption=''; }
      if(type==='checklist') card.items = [{text:'', done:false}];
      state.cards.push(card);
      board.appendChild(buildCard(card));
      scheduleSave();
    });
  });

  document.getElementById('clearBoard').addEventListener('click', ()=>{
    if(confirm('Clear the whole board? This removes all your cards.')){
      state.cards = [];
      renderAll();
      scheduleSave();
    }
  });

  gradYearInput.addEventListener('pointerdown', e=>e.stopPropagation());
  gradYearInput.addEventListener('change', ()=>{
    state.gradYear = gradYearInput.value.trim();
    scheduleSave();
  });

  // export / import as a storage-independent fallback
  document.getElementById('exportBoard').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'vision-board.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  const importInput = document.getElementById('importFile');
  document.getElementById('importBoard').addEventListener('click', ()=> importInput.click());
  importInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const parsed = JSON.parse(ev.target.result);
        if(parsed && Array.isArray(parsed.cards)){
          state = parsed;
          gradYearInput.value = state.gradYear || '2030';
          renderAll();
          scheduleSave();
        } else {
          alert('That file doesn\'t look like a vision board export.');
        }
      }catch(err){
        alert('Couldn\'t read that file: ' + err.message);
      }
    };
    reader.readAsText(file);
    importInput.value = '';
  });

  initAuth();
})();
</script>
</body>
</html>
