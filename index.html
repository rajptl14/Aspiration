<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F4EE;
    --paper-raised:#FBFAF6;
    --ink:#1E2A32;
    --ink-soft:#4A5860;
    --sage:#52796F;
    --sage-deep:#3C5B52;
    --amber:#C98A3E;
    --brick:#9C4A3C;
    --line:#D8D3C7;
    --line-soft:#E7E3D8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:36px 24px 80px;}

  /* Masthead */
  .masthead{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:3px solid var(--ink);
    padding-bottom:16px;
    margin-bottom:8px;
  }
  .masthead h1{
    font-family:'Source Serif 4',serif;
    font-weight:700;
    font-size:2.1rem;
    margin:0;
    letter-spacing:-0.01em;
  }
  .masthead .sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-top:4px;
  }
  .masthead .today{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    color:var(--ink-soft);
    text-align:right;
  }

  /* Summary strip */
  .summary{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    margin:24px 0 32px;
  }
  .summary .cell{
    background:var(--paper-raised);
    padding:14px 12px;
  }
  .summary .cell .num{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:1.5rem;
    line-height:1;
  }
  .summary .cell .label{
    font-size:0.68rem;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-top:6px;
  }
  .summary .cell.total{background:var(--ink);}
  .summary .cell.total .num,.summary .cell.total .label{color:var(--paper);}

  /* Section headers */
  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--ink-soft);
    margin:32px 0 10px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  /* Form */
  .form-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    padding:20px;
  }
  .form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.span2{grid-column:1/-1;}
  .field label{
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-soft);
    font-weight:600;
  }
  .field input,.field select,.field textarea{
    font-family:'Inter',sans-serif;
    font-size:0.92rem;
    padding:9px 10px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    border-radius:2px;
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:2px solid var(--sage);
    outline-offset:1px;
  }
  .field textarea{resize:vertical;min-height:52px;font-family:'Inter',sans-serif;}
  .form-actions{
    margin-top:16px;
    display:flex;
    justify-content:flex-end;
    gap:10px;
  }
  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:0.85rem;
    padding:10px 18px;
    border:none;
    border-radius:2px;
    cursor:pointer;
  }
  .btn-primary{background:var(--sage);color:#fff;}
  .btn-primary:hover{background:var(--sage-deep);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink-soft);color:var(--ink);}

  /* Entries */
  .entry{
    display:flex;
    border:1px solid var(--line);
    border-top:none;
    background:var(--paper-raised);
  }
  .entry:first-of-type{border-top:1px solid var(--line);}
  .flag{
    width:6px;
    flex-shrink:0;
  }
  .entry-body{
    flex:1;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    padding:14px 16px;
  }
  .entry-main .top-row{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }
  .entry-main .name{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:1.02rem;
  }
  .entry-main .cat-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.62rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    padding:2px 6px;
    border-radius:2px;
    color:#fff;
  }
  .entry-main .org{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .entry-main .notes{
    font-size:0.83rem;
    color:var(--ink-soft);
    margin-top:6px;
    font-style:italic;
  }
  .entry-meta{
    text-align:right;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:4px;
  }
  .entry-meta .hours{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:1.1rem;
  }
  .entry-meta .date{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
    color:var(--ink-soft);
  }
  .entry-meta .del{
    font-size:0.7rem;
    color:var(--brick);
    background:none;
    border:none;
    padding:2px 0;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-weight:500;
  }
  .entry-meta .del:hover{text-decoration:underline;}

  .empty{
    border:1px dashed var(--line);
    padding:32px;
    text-align:center;
    color:var(--ink-soft);
    font-size:0.9rem;
  }

  .footer-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
    gap:12px;
    flex-wrap:wrap;
  }
  .footer-actions .hint{
    font-size:0.72rem;
    color:var(--ink-soft);
  }

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:var(--paper);
    padding:10px 18px;
    border-radius:3px;
    font-size:0.85rem;
    opacity:0;
    transition:opacity 0.25s ease, transform 0.25s ease;
    pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:560px){
    .form-grid{grid-template-columns:1fr;}
    .masthead{flex-direction:column;align-items:flex-start;gap:6px;}
    .masthead .today{text-align:left;}
    .entry-body{flex-direction:column;}
    .entry-meta{flex-direction:row;align-items:center;width:100%;justify-content:space-between;}
  }

  /* Lock screen */
  .lock-overlay{
    position:fixed;
    inset:0;
    background:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
  }
  .lock-card{
    position:relative;
    width:300px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-top:4px solid var(--sage);
    padding:28px 24px 24px;
    text-align:center;
  }
  .lock-card .tab{
    position:absolute;
    top:-13px;
    left:50%;
    transform:translateX(-50%);
    font-family:'IBM Plex Mono',monospace;
    font-size:0.62rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:#fff;
    background:var(--sage);
    padding:3px 10px;
    border-radius:2px;
  }
  .lock-card h2{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:1.4rem;
    margin:14px 0 4px;
    color:var(--ink);
  }
  .lock-card p{
    font-size:0.8rem;
    color:var(--ink-soft);
    margin:0 0 18px;
  }
  .lock-card input{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:0.92rem;
    padding:9px 10px;
    margin-bottom:10px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    border-radius:2px;
    text-align:center;
  }
  .lock-card input:focus{
    outline:2px solid var(--sage);
    outline-offset:1px;
  }
  .lock-card button{
    width:100%;
  }
  .lock-error{
    color:var(--brick);
    font-size:0.78rem;
    min-height:16px;
    margin-top:10px;
  }
  .lock-forgot{
    margin-top:14px;
    font-size:0.72rem;
    color:var(--ink-soft);
    background:none;
    border:none;
    text-decoration:underline;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
</style>
</head>
<body>

<div class="lock-overlay" id="lockSetup" style="display:none;">
  <div class="lock-card">
    <div class="tab">new log</div>
    <h2>Set a password</h2>
    <p>This locks your log on this device. There's no account recovery — if you forget it, you'll need to reset the log.</p>
    <input type="password" id="setupPass" placeholder="Choose a password" autocomplete="new-password">
    <input type="password" id="setupPassConfirm" placeholder="Confirm password" autocomplete="new-password">
    <button class="btn-primary" onclick="handleSetup()">Save &amp; continue</button>
    <p class="lock-error" id="setupError"></p>
  </div>
</div>

<div class="lock-overlay" id="lockLogin" style="display:none;">
  <div class="lock-card">
    <div class="tab">locked</div>
    <h2>Welcome back</h2>
    <p>Enter your password to open your log.</p>
    <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')handleLogin()">
    <button class="btn-primary" onclick="handleLogin()">Unlock</button>
    <p class="lock-error" id="loginError"></p>
    <button class="lock-forgot" onclick="handleForgot()">Forgot password? Reset the log</button>
  </div>
</div>

<div class="wrap" id="app" style="display:none;">

  <div class="masthead">
    <div>
      <h1>The Log</h1>
      <div class="sub">Clinical &amp; premed activity record</div>
    </div>
    <div class="today" id="todayDate"></div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="section-label">New entry</div>
  <div class="form-card">
    <div class="form-grid">
      <div class="field span2">
        <label for="f-name">Activity name</label>
        <input id="f-name" type="text" placeholder="e.g. ER volunteer, Dr. Alvarez shadowing">
      </div>
      <div class="field">
        <label for="f-cat">AMCAS category</label>
        <select id="f-cat">
          <option value="clinical-paid">Clinical (Paid)</option>
          <option value="clinical-volunteer">Clinical (Volunteer)</option>
          <option value="nonclinical-volunteer">Non-Clinical Volunteering</option>
          <option value="shadowing">Physician Shadowing</option>
          <option value="research">Research</option>
          <option value="leadership">Leadership / Teaching</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="f-org">Organization</label>
        <input id="f-org" type="text" placeholder="e.g. Memorial Hospital">
      </div>
      <div class="field">
        <label for="f-date">Date</label>
        <input id="f-date" type="date">
      </div>
      <div class="field">
        <label for="f-hours">Hours</label>
        <input id="f-hours" type="number" step="0.25" min="0" placeholder="3.5">
      </div>
      <div class="field span2">
        <label for="f-notes">Notes (supervisor, what you did, contact info)</label>
        <textarea id="f-notes" placeholder="Optional — helpful to have for your AMCAS descriptions later"></textarea>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn-ghost" id="clearForm">Clear</button>
      <button class="btn-primary" id="addEntry">Log entry</button>
    </div>
  </div>

  <div class="section-label">Entries</div>
  <div id="entries"></div>

  <div class="footer-actions">
    <div class="hint" id="storageHint">Loading your log…</div>
    <div style="display:flex;gap:10px;">
      <button class="btn-ghost" id="exportBtn">Copy summary</button>
      <button class="btn-ghost" id="resetBtn">Clear all data</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const CATS = {
  "clinical-paid":        { label: "Clinical (Paid)",         color: "#52796F" },
  "clinical-volunteer":   { label: "Clinical (Vol.)",         color: "#3C5B52" },
  "nonclinical-volunteer":{ label: "Non-Clinical Vol.",       color: "#C98A3E" },
  "shadowing":            { label: "Shadowing",               color: "#9C4A3C" },
  "research":             { label: "Research",                color: "#4A5860" },
  "leadership":           { label: "Leadership",              color: "#1E2A32" },
  "other":                { label: "Other",                   color: "#8A8172" }
};

let entries = [];
const STORAGE_KEY = 'premed-log-entries';
const PASS_KEY = 'premed-log-password-hash';

const $ = (id) => document.getElementById(id);

async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function initAuth(){
  if(typeof crypto === 'undefined' || !crypto.subtle){
    // no crypto available — skip the lock rather than block access
    unlockApp();
    return;
  }
  let stored = null;
  try{
    stored = await window.storage.get(PASS_KEY, false);
  }catch(e){
    stored = null; // key doesn't exist yet
  }
  if(!stored){
    $('lockSetup').style.display = 'flex';
    $('setupPass').focus();
  }else{
    window._storedHash = stored.value;
    $('lockLogin').style.display = 'flex';
    $('loginPass').focus();
  }
}

async function handleSetup(){
  const pass = $('setupPass').value;
  const confirm = $('setupPassConfirm').value;
  if(!pass || pass.length < 4){
    $('setupError').textContent = 'Use at least 4 characters.';
    return;
  }
  if(pass !== confirm){
    $('setupError').textContent = "Passwords don't match.";
    return;
  }
  const hash = await sha256(pass);
  try{
    const result = await window.storage.set(PASS_KEY, hash, false);
    if(!result){
      $('setupError').textContent = 'Could not save password — try again.';
      return;
    }
  }catch(e){
    $('setupError').textContent = 'Could not save password — try again.';
    return;
  }
  $('lockSetup').style.display = 'none';
  unlockApp();
}

async function handleLogin(){
  const pass = $('loginPass').value;
  const hash = await sha256(pass);
  if(hash === window._storedHash){
    $('lockLogin').style.display = 'none';
    unlockApp();
  }else{
    $('loginError').textContent = 'Incorrect password.';
    $('loginPass').value = '';
    $('loginPass').focus();
  }
}

async function handleForgot(){
  if(!confirm('Reset your password? This does NOT delete your logged entries, but you\'ll set a new password now.')) return;
  try{
    await window.storage.delete(PASS_KEY, false);
  }catch(e){ /* ignore */ }
  $('lockLogin').style.display = 'none';
  $('lockSetup').style.display = 'flex';
  $('setupPass').focus();
}

function unlockApp(){
  $('app').style.display = 'block';
  loadEntries();
}

function todayStr(){
  const d = new Date();
  return d.toLocaleDateString('en-US',{weekday:'long', year:'numeric', month:'long', day:'numeric'});
}
$('todayDate').textContent = todayStr();
$('f-date').value = new Date().toISOString().slice(0,10);

function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

async function loadEntries(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    entries = res ? JSON.parse(res.value) : [];
  }catch(e){
    entries = [];
  }
  $('storageHint').textContent = 'Saved automatically to your account.';
  render();
}

async function saveEntries(){
  try{
    const result = await window.storage.set(STORAGE_KEY, JSON.stringify(entries), false);
    if(!result){
      $('storageHint').textContent = 'Could not save — check connection.';
    }
  }catch(e){
    $('storageHint').textContent = 'Could not save — check connection.';
  }
}

function render(){
  // summary
  const totals = {};
  let grand = 0;
  entries.forEach(e=>{
    totals[e.cat] = (totals[e.cat]||0) + Number(e.hours);
    grand += Number(e.hours);
  });
  const summaryEl = $('summary');
  summaryEl.innerHTML = '';
  Object.keys(CATS).forEach(key=>{
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = `<div class="num">${(totals[key]||0).toFixed(1)}</div><div class="label">${CATS[key].label}</div>`;
    summaryEl.appendChild(cell);
  });
  const totalCell = document.createElement('div');
  totalCell.className = 'cell total';
  totalCell.innerHTML = `<div class="num">${grand.toFixed(1)}</div><div class="label">Total hours</div>`;
  summaryEl.appendChild(totalCell);

  // entries list
  const list = $('entries');
  list.innerHTML = '';
  if(entries.length === 0){
    list.innerHTML = '<div class="empty">No entries yet. Log your first activity above — future you will thank you.</div>';
    return;
  }
  const sorted = [...entries].sort((a,b)=> new Date(b.date) - new Date(a.date));
  sorted.forEach(e=>{
    const cat = CATS[e.cat] || CATS.other;
    const row = document.createElement('div');
    row.className = 'entry';
    row.innerHTML = `
      <div class="flag" style="background:${cat.color}"></div>
      <div class="entry-body">
        <div class="entry-main">
          <div class="top-row">
            <span class="name">${escapeHtml(e.name)}</span>
            <span class="cat-tag" style="background:${cat.color}">${cat.label}</span>
          </div>
          <div class="org">${escapeHtml(e.org || '—')}</div>
          ${e.notes ? `<div class="notes">${escapeHtml(e.notes)}</div>` : ''}
        </div>
        <div class="entry-meta">
          <div class="hours">${Number(e.hours).toFixed(2)}h</div>
          <div class="date">${formatDate(e.date)}</div>
          <button class="del" data-id="${e.id}">Delete</button>
        </div>
      </div>
    `;
    list.appendChild(row);
  });

  list.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      entries = entries.filter(en => en.id !== btn.dataset.id);
      await saveEntries();
      render();
      showToast('Entry deleted');
    });
  });
}

function formatDate(d){
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US',{month:'short', day:'numeric', year:'numeric'});
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

$('addEntry').addEventListener('click', async ()=>{
  const name = $('f-name').value.trim();
  const cat = $('f-cat').value;
  const org = $('f-org').value.trim();
  const date = $('f-date').value;
  const hours = $('f-hours').value;
  const notes = $('f-notes').value.trim();

  if(!name || !hours || !date){
    showToast('Add a name, date, and hours first');
    return;
  }

  entries.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name, cat, org, date, hours: Number(hours), notes
  });

  await saveEntries();
  render();
  showToast('Entry logged');

  $('f-name').value = '';
  $('f-org').value = '';
  $('f-hours').value = '';
  $('f-notes').value = '';
});

$('clearForm').addEventListener('click', ()=>{
  $('f-name').value = '';
  $('f-org').value = '';
  $('f-hours').value = '';
  $('f-notes').value = '';
});

$('exportBtn').addEventListener('click', ()=>{
  if(entries.length === 0){
    showToast('Nothing to copy yet');
    return;
  }
  const totals = {};
  let grand = 0;
  entries.forEach(e=>{
    totals[e.cat] = (totals[e.cat]||0) + Number(e.hours);
    grand += Number(e.hours);
  });
  let out = `PREMED ACTIVITY SUMMARY — ${new Date().toLocaleDateString('en-US')}\n\n`;
  Object.keys(CATS).forEach(key=>{
    if(totals[key]) out += `${CATS[key].label}: ${totals[key].toFixed(1)} hrs\n`;
  });
  out += `\nTOTAL: ${grand.toFixed(1)} hrs\n\n---\n\n`;
  const sorted = [...entries].sort((a,b)=> new Date(b.date) - new Date(a.date));
  sorted.forEach(e=>{
    out += `${formatDate(e.date)} | ${CATS[e.cat].label} | ${e.name} @ ${e.org||'—'} | ${Number(e.hours).toFixed(2)}h\n`;
    if(e.notes) out += `   ${e.notes}\n`;
  });
  navigator.clipboard.writeText(out).then(()=>{
    showToast('Summary copied to clipboard');
  }).catch(()=>{
    showToast('Could not copy — try selecting manually');
  });
});

$('resetBtn').addEventListener('click', async ()=>{
  if(!confirm('Delete all logged entries? This cannot be undone.')) return;
  entries = [];
  await saveEntries();
  render();
  showToast('All entries cleared');
});

initAuth();
</script>
</body>
</html>
